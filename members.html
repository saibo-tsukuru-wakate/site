  <!-- ===== 運営メンバー ===== -->
  <section class="section section-wide">
    <h2 class="section-title" data-aos="fade-up">
      <span class="accent">運営メンバー</span>
    </h2>
    <p class="section-sub" data-aos="fade-up" data-aos-delay="100">
      若手の会のコアメンバーです。
    </p>

    <!--
      ★★★ メンバーの追加方法 ★★★

      <tbody> 内の <tr>...</tr> を1ブロックコピーして情報を書き換えてください。

      【各列の説明】
        氏名        … フルネームを記入
        所属        … 大学・研究所・企業名など
        役割        … 代表 / 副代表 / 広報 / Web担当 など
        専門分野    … 研究テーマやキーワード
        researchmap … URLを記入。ない場合は「—」で OK

      【researchmap のリンク形式】
        https://researchmap.jp/ユーザーID

      【行を増やすときの注意】
        <tr> をコピペするだけで自動的に表に追加されます。
        data-aos-delay は不要です（表全体でアニメーションするため）。
    -->

    <div class="table-wrap" data-aos="fade-up" data-aos-delay="200">
      <table class="member-table">
        <thead>
          <tr>
            <th>氏名</th>
            <th>所属</th>
            <th>役割</th>
            <th>専門分野</th>
            <th>researchmap</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td colspan="5">運営メンバー情報は公開準備中です。</td>
          </tr>

          <!--
            ★ メンバーを追加するには、上の <tr>...</tr> ブロックを
              コピーしてここに貼り付け、情報を書き換えてください。
              researchmap がない方は「—」と記載してください。
          -->

        </tbody>
      </table>
    </div>
  </section>


  <!-- ===== アドバイザー（任意セクション） ===== -->
  <!--
    ★ アドバイザーや顧問を表示したい場合はコメントを外して、

  <section class="section section-wide">
    <h2 class="section-title" data-aos="fade-up">
      アドバイザー<span class="accent">・顧問</span>
    </h2>
    <p class="section-sub" data-aos="fade-up" data-aos-delay="100">

    <div class="table-wrap" data-aos="fade-up" data-aos-delay="200">

            <th>役割</th>
            <th>専門分野</th>

        <tbody>
          <tr>
            <td class="name-cell">教授 名前</td>
            <td>大学名 学部名</td>
            <td><span class="role">顧問</span></td>
            <td>専門分野</td>
            <td>—</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
  -->
